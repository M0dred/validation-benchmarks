services:
  db:
    build: ./mysql
    expose:
    - 3306:3306
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      - --password=ssti_blind_loan_calculator
      - -u
      - root
      timeout: 5s
      retries: 30
      interval: 5s
  ssti_blind_loan_calculator:
    build:
      context: ./app
      args:
      - FLAG
    depends_on:
      db:
        condition: service_healthy
    ports:
    - 80
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      timeout: 5s
      retries: 30
      interval: 5s
